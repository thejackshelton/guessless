version: 2

goal:
  title: "Guessless v1"
  slug: "guessless-v1"
  kind: existing_plan
  tranche: "Continuously implement and prove the complete root goal.md outcome using the applicable Versionless TypeScript/Vite Plus/pnpm-monorepo structure."
  status: done
  oracle:
    signal: "All root goal.md requirements map to current implementation and reproducible evidence, including the three-part oracle."
    cadence: "after each Worker package and at final audit"
    final_proof: "Adversarial receipt ledger, three pinned real-corpus results plus LSP comparison, same-model agent evaluation, full verification, and final full_outcome_complete audit."
  intake:
    original_request: "goal.md Make sure you copy the versionless structure that being TypeScript, Vite Plus monorepo pnpm etc."
    interpreted_outcome: "Build and prove Guessless v1 exactly as chartered, using Versionless's applicable TypeScript/Vite Plus/pnpm monorepo conventions."
    input_shape: existing_plan
    audience: "coding agents and engineers"
    authority: requested
    proof_type: test
    completion_proof: "A current requirement-by-requirement audit proves the root goal.md, structural constraint, deliverables, and all three oracle parts."
    likely_misfire: "Stop at a Versionless-shaped scaffold or generic retrieval bridge without proving receipt honesty and behavior queries."
    blind_spots_considered:
      - "Yuku APIs and limitations need direct evidence."
      - "External corpus and comparison work needs explicit, pinned network phases."
      - "Versionless product semantics must not leak into Guessless merely because its structure is the model."
    existing_plan_facts:
      - "The root goal.md is the fixed product specification."
      - "Engine, then MCP server, then CLI."
      - "Use TypeScript, Vite Plus, and a pnpm monorepo modeled on ../versionless."
      - "The receipt contract and three-part oracle are completion-critical."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

