# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Guessless must-have fixes"
  slug: "guessless-must-have-fixes"
  kind: specific
  tranche: "Fix the four defect classes from adoption-eval-fable-v1, re-validate honesty on the same ground-truth corpora, then demonstrate one must-have scenario — continuing until the full outcome is complete."
  status: active
  oracle:
    signal: "An adoption-eval-fable-v2 re-trial over the sealed v1 ground-truth corpora shows zero missed-and-unnamed sites (every ground-truth site either returned or named in unresolved), full workspace verification is green, and one receipted demonstration shows guessless materially beating baseline tooling on a repo class where the guarantee matters."
    cadence: "after each Worker package and at final audit"
    final_proof: "v2 evidence bundle with per-defect before/after receipts, green pnpm build/test/typecheck/lint, the demonstration receipt, and a final Judge audit mapping each of D1-D4 and the must-have claim to evidence, recording full_outcome_complete: true."
  intake:
    original_request: "Go in and improve all the critical issues of guessless, use fable opus cockpit and 15m /loop. Get us to a state where we are confident this is a must have tool for some repos."
    interpreted_outcome: "The four defect classes documented in docs/evidence/adoption-eval-fable-v1/verdict.md are fixed fail-closed, the honesty contract re-validates on real corpora, and at least one repo class is demonstrated where guessless is a must-have rather than a grep substitute."
    input_shape: specific
    audience: "Guessless maintainer and agent-tool consumers in the markless/versionless/frameless family"
    authority: requested
    proof_type: metric
    completion_proof: "Zero missed-and-unnamed sites across the re-run v1 ground truth; all four defect regression tests green in the suite; one demonstration receipt where baseline tooling misses or cannot run and guessless answers with an honest receipt."
    likely_misfire: "Fixing the four defects with narrow patches that satisfy the exact v1 fixtures but not the defect class; or declaring must-have from the honesty re-trial alone without demonstrating a scenario where guessless beats a grep-capable agent."
    blind_spots_considered:
      - "vp pack rebuilds dist for every package; allowed_files must include dist outputs or verify fails on scope."
      - "The workspace has no git repo; without a baseline commit, Worker slices are not reversible and cockpit worktree isolation is impossible."
      - "D3 may be a deliberate binding-level design choice; the fix may be receipt vocabulary (named possible-mutation sites) rather than full may-mutate analysis, but README and receipt must agree either way."
      - "Sealed evidence (oracle-part-3-v3..v11, adoption-eval-fable-v1, guessless-fast-value-validation) is immutable; v2 evidence gets a fresh directory."
      - "The small-repo A/B showed guessless adds cost without correctness lift; must-have confidence requires a scenario grep cannot serve, not another small-repo win."
    existing_plan_facts:
      - "Defect classes D1-D4 and suggested fail-closed fixes are documented in docs/evidence/adoption-eval-fable-v1/verdict.md with raw receipts in raw-markless/ and raw-versionless/."
      - "D1 isolation A/B: raw-versionless/q23 (alias imports, saga.js invisible) vs q25 (relativised, sites appear)."
      - "D3 evidence: raw-markless/q10 writesOf complete/empty vs 10 records.push sites in markless serializer src/value.ts."
      - "User requires execution via the fable-opus cockpit (opus-worker packets) and a 15m /loop cadence."
      - "Guessless workspace verification: pnpm build, pnpm test (258 tests), pnpm typecheck, pnpm lint."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/guessless-must-have-fixes/"
    command: "node /Users/jacksm5pro/.claude/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/guessless-must-have-fixes"

