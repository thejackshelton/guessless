    constraints:
      - "Use gpt-5.6-sol for every cell. Run exactly six paired tasks: two authentic recent JS/TS maintenance commits from each of Markless, Frameless, and Versionless."
      - "For each task, checkout the parent commit into two isolated temporary worktrees. Derive one concise maintenance prompt from the historical issue/commit intent, but hide the solution commit, diff, hashes, and expected file list from both agents."
      - "Launch the first pair as soon as its first eligible task is selected and before selecting the remaining five tasks. First agent process must start within five minutes of T001 start."
      - "Run one control and one treatment agent per task with identical prompt, model, starting bytes, timeout, permissions, and environment. Counterbalance control-first and treatment-first order 3/3."
      - "Control has no Guessless MCP. Treatment has the current Guessless MCP exactly as installed, but the shared task prompt must not mention, require, hint at, or reward Guessless use."
      - "Agents must implement the real change and run the repository's relevant tests. Do not reduce the task to impact analysis, answer retrieval, or a synthetic question."
      - "Use direct git, Codex, and repository test commands. Do not create or modify evaluator code, runner scripts, fixtures, schemas, calibration, setup utilities, or package metadata."
      - "No retry, resume, prompt repair, task substitution, selective omission, or post-hoc rerun. A failed or invalid cell remains in the denominator and the batch continues."
      - "Durably record before judging: task provenance, parent/solution hashes, frozen prompt hash, starting-tree hash, command/argv parity with the single MCP difference, raw stdout/stderr, final response, patch, test output, wall time, reported tokens, tools, Guessless calls, exit state, and invalid/refused reason."
