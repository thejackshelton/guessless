      - "First live pair launches within five minutes of task start."
      - "Exactly six authentic tasks and twelve real model-backed agent cells exist: two tasks per repository and six cells per arm."
      - "Every task comes from a real historical commit whose parent is the agent starting state and whose solution remains hidden until both paired cells finish."
      - "Prompt/model/tree/limit/environment parity is byte-proven per pair; only treatment Guessless MCP availability differs."
      - "Every attempted cell preserves transcript, patch, tests, timing, tokens, tools, Guessless calls, and a closed outcome: complete, partial with named gaps, or refused/invalid with a reason."
      - "Score task completion from relevant tests plus blinded semantic comparison with the historical solution; exact textual patch matching is not required."
      - "Seal a manifest, six pair records, twelve raw cell records, aggregate completion/correctness/false-completeness metrics, correctness-conditioned time/token/tool deltas, and unforced Guessless selection."
