version: 2

goal:
  title: "Guessless real-agent repository benchmark"
  slug: guessless-real-agent-benchmark
  kind: specific
  tranche: "Launch real paired coding agents immediately on authentic repository work, seal their tested outputs, and make the adoption decision."
  status: active
  oracle:
    signal: "Real same-model agents produce sealed patches and test results on authentic Markless, Frameless, and Versionless maintenance tasks, with control/treatment parity and a frozen treatment-only Guessless onboarding context."
    cadence: "after the corrected first pair, after the fixed v3 live batch, and at final audit"
    final_proof: "Raw transcripts, patches, tests, timing, token/tool accounting, informed Guessless selection and successful-result evidence, paired scoring, and an explicit adoption decision."
  intake:
    original_request: "Give me a GoalBuddy goal that gets immediately into benchmarks with real agents and spends no time on harness or setup."
    interpreted_outcome: "Measure Guessless on authentic coding-agent work now, without another harness-building detour."
    input_shape: specific
    audience: "Guessless maintainer deciding whether real coding agents benefit"
    authority: approved
    proof_type: metric
    completion_proof: "A fixed batch of authentic paired real-agent runs is sealed and audited into an explicit decision."
    likely_misfire: "Spending the run on benchmark infrastructure, synthetic fixtures, protocol polish, or offline proofs instead of launching real agents."
    blind_spots_considered:
      - "Recent real commits can leak their solution unless agents run from the parent commit and cannot inspect the hidden commit."
      - "Tests and patch quality matter more than tool invocation alone."
      - "An unfamiliar MCP must be introduced with a neutral usage and honesty context; cold availability alone does not measure product usefulness."
      - "Task and model parity must hold without turning parity checks into a setup phase."
    existing_plan_facts:
      - "The prior 36-cell synthetic adoption benchmark is complete and must not be rerun or modified."
      - "The latest safe-change run showed artifact value on one task but zero unforced live Guessless selection."
      - "This fresh tranche answers the remaining real-repository, real-agent question."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/guessless-real-agent-benchmark/"
    command: "node /Users/jacksm5pro/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/guessless-real-agent-benchmark"

