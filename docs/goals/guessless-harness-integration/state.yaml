    assignee: Worker
    status: done
    reasoning_hint: high
    objective: "Build the gate machinery in guessless. scripts/claim-gate.mjs: a Claude Code Stop-hook adapter that reads hook JSON from stdin, scans the final assistant message for completeness claims over JS/TS structure ('all call sites', 'no other usages/references', 'safe to delete', 'renamed every', and similar), and if one is present without a cited guessless receipt (a receipt path or inline receipt JSON whose state it can parse), blocks with a message telling the agent to attach a receipt or qualify the claim; a receipted claim passes only if the claim is consistent with the receipt state (complete -> may claim all; partial -> claim must acknowledge gaps). scripts/reproduce-check.mjs: given a directory or file list, finds *.receipt.json and runs the guessless CLI reproduce against each, exiting non-zero on any non-reproduction. docs/integration.md: the four-layer integration guide with copy-paste blocks for AGENTS.md, the skill, the settings.json hook entry, and CI. Tests for both scripts (node --test or vitest, wired into pnpm test) covering: unreceipted claim -> block; receipted complete claim -> pass; partial receipt with unacknowledged 'all' claim -> block; no claim -> pass; reproduce pass and tamper-fail paths. Dispatch via a fable-opus cockpit packet."
    allowed_files:
      - scripts/**
      - docs/integration.md
      - vite.config.ts
      - package.json
      - pnpm-lock.yaml
    verify:
      - "pnpm install --frozen-lockfile --prefer-offline"
      - "pnpm build"
      - "pnpm test"
      - "pnpm typecheck"
      - "pnpm lint"
    stop_if:
      - "Need files outside allowed_files."
