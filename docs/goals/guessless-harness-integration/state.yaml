    url: "http://goalbuddy.localhost:41737/guessless-harness-integration/"
    command: "node /Users/jacksm5pro/.claude/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/guessless-harness-integration"

