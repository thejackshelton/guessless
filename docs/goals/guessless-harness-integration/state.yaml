# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Guessless harness integration"
  slug: "guessless-harness-integration"
  kind: specific
  tranche: "Ship the four integration layers (docs block, skill, stop-hook gate, CI reproduce check) into markless, versionless, and frameless, with the gate machinery living in guessless — then audit that every layer exists and the gate mechanically fires."
  status: done
  oracle:
    signal: "In each target repo: AGENTS.md carries the guessless block, a guessless skill with valid frontmatter exists, and the stop-hook is wired in .claude/settings.json (valid JSON, pre-existing config preserved) pointing at guessless's claim-gate script. In guessless: claim-gate and reproduce-check scripts exist with tests proving the gate rejects an unreceipted completeness claim, accepts a receipted one, and ignores non-claims. Final Judge verifies all of it mechanically, including a live hook-fire test."
    cadence: "after each Worker package and at final audit"
    final_proof: "Judge audit receipt with full_outcome_complete: true mapping every layer in every repo to file evidence and a passing gate test."
  intake:
    original_request: "Go ahead and start adding it now. Use fable opus cockpit with goal prep in 15m /loop."
    interpreted_outcome: "The four-layer guessless integration (AGENTS.md/CLAUDE.md block, per-repo skill, stop-hook claim gate, CI reproduce check) is wired into markless, versionless, and frameless, with shared gate machinery shipped from the guessless repo."
    input_shape: specific
    audience: "Jack's agent harnesses (Claude Code and Codex) across the -less family repos"
    authority: requested
    proof_type: artifact
    completion_proof: "All files in place per oracle; gate script test suite green; hook-fire test passes; no target-repo config clobbered."
    likely_misfire: "Overwriting markless's existing .claude/settings.json or skills; committing or pushing in target repos without owner review; building an elaborate gate that no harness actually invokes; or wiring docs layers while the enforcing hook layer silently doesn't fire."
    blind_spots_considered:
      - "The fable-opus scope guard's contract globs may not match absolute paths outside the guessless project root; the first cross-repo unit reveals this. Fallback: PM executes that task directly under GoalBuddy PM-task authority with explicit allowed files, recording the deviation."
      - "markless has concurrent writers (dev server or another agent observed earlier); target-repo changes stay uncommitted for owner review, additive files only, AGENTS.md edits append-only."
      - "A Stop hook receives a transcript path, not a claim string; the gate script needs a real Claude Code hook adapter reading hook JSON from stdin, and its test must exercise that shape."
      - "versionless has strict network/consent conventions; the CI reproduce script must be offline-only there."
      - "Skill frontmatter must be valid or Claude Code silently ignores the skill."
    existing_plan_facts:
      - "Layering agreed with owner: agents.md documents, skill remembers, stop-hook enforces, CI verifies with zero agent cooperation; if only one thing lands, it is the hook."
      - "Gate machinery lives in guessless (single source): scripts/claim-gate.mjs and scripts/reproduce-check.mjs, referenced by absolute path from target repos."
      - "Target repo state at prep: all three have git + AGENTS.md; markless also has CLAUDE.md, .claude/settings.json, and .claude/skills (merge, never overwrite); versionless and frameless have no .claude directory."
      - "guessless CLI reproduce re-verifies receipts byte-for-byte; receipts are JSON with state complete|partial|refused and closed unresolved reasons — the gate is a JSON field check, ~20 lines of logic."
      - "Execution via fable-opus cockpit packets at a 15m /loop cadence."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

