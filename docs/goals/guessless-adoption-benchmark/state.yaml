version: 2

goal:
  title: "Guessless adoption benchmark"
  slug: guessless-adoption-benchmark
  kind: specific
  tranche: "Design, implement, execute, verify, and publish a decision-grade repeated paired Guessless benchmark."
  status: done
  oracle:
    signal: "A sealed repeated paired same-model benchmark produces verified effect metrics and an explicit sibling-repository adoption decision under preregistered criteria."
    cadence: "at protocol approval, pre-live gate, post-live analysis, and final audit"
    final_proof: "Complete valid paired trials, raw transcripts, manifest/replay/calibration, uncertainty-aware metrics, and a criterion-backed adopt/pilot/do-not-adopt decision."
  intake:
    original_request: "Do a conclusive benchmark so we can know whether or not we need to put it into markless, frameless, versionless, etc. asap"
    interpreted_outcome: "Obtain a trustworthy immediate adoption decision for Guessless across sibling repositories."
    input_shape: specific
    audience: "maintainer of Guessless and sibling projects"
    authority: requested
    proof_type: metric
    completion_proof: "A preregistered repeated paired benchmark completes, verifies, and yields an explicit evidence-backed adoption decision."
    likely_misfire: "Treat another single invalid run or synthetic metric without a fixed decision rule as conclusive."
    blind_spots_considered:
      - "Codex fixed-context token accounting invalidated the previous 16k total-token cap."
      - "Order, warm-cache, model nondeterminism, and synthetic-task scope need counterbalancing and uncertainty."
      - "The decision should govern a sibling-repo pilot, not overclaim universal causality."
    existing_plan_facts:
      - "V1 and v2 evidence are immutable historical attempts."
      - "A new versioned protocol must preserve paired prompt/model/fixture/scoring parity."
      - "Raw evidence, benchmarks, and a final adoption decision are required."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/guessless-adoption-benchmark/"
    command: "node /Users/jacksm5pro/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/guessless-adoption-benchmark"

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Audit the existing v1/v2 evaluator, evidence, prompts, fixtures, scoring, token accounting, and failure topology; propose the smallest preregistered repeated paired protocol that can yield a defensible sibling-repository adoption decision quickly."
    inputs:
      - goal.md
      - README.md
      - packages/evaluation/src
      - packages/evaluation/test
      - packages/evaluation/fixtures/oracle-part-3-v1
      - packages/evaluation/fixtures/oracle-part-3-v2
      - docs/evidence/oracle-part-3-attempt.md
      - docs/evidence/oracle-part-3-v2
    constraints:
      - "Read-only; no model/network calls or file edits."
      - "Distinguish statistical conclusiveness, protocol validity, and the narrower product-adoption decision."
      - "Return exact source paths, current failure causes, realistic cell counts, counterbalancing, token semantics, decision thresholds, costs, and implementation surfaces."
    expected_output:
      - "Evidence map and v2 failure diagnosis"
      - "Preregistered v3 design with repetitions, order, validity, stopping, and decision rules"
      - "Exact implementation and evidence surfaces"
      - "Cost/time estimate and risks"
    receipt:
      result: done
      summary: "V2 failed solely because its first correct control response reported 61,066 total tokens against a 16,000 cap; the remaining five cells were deliberately unrun. The smallest credible v3 is 18 paired trials/36 cells: six repetitions of each of three tasks, counterbalanced AB/BA, all attempts sealed, with at least five valid pairs per task. Record final-turn total usage but never validity-gate it. Complete all cells without retries, calculate paired correctness and efficiency uncertainty, then mechanically emit adopt/pilot/do-not-adopt under preregistered thresholds. Expected runtime is roughly 15–45 minutes and about 2.2M reported tokens at the observed baseline."
      evidence:
        - "packages/evaluation/fixtures/oracle-part-3-v2/protocol.json fixes one pair per task, 16 tool calls, 16,000 reported-token cap, 300-second timeout, and counterbalanced task order."
        - "docs/evidence/oracle-part-3-v2/raw/runs.jsonl proves the correct four-site terminal was failed only by TOKEN_BUDGET_EXCEEDED 61066>16000 and five cells were canonical unrun."
        - "packages/evaluation/src/codex.ts records the last turn.completed input_tokens+output_tokens and currently uses it as a validity cap despite Codex fixed context."
        - "packages/evaluation/src/codex.ts preserves arm parity and differs only by Guessless MCP arguments."
        - "packages/evaluation/src/scoring.ts lacks repeated-pair uncertainty and decision classification."
        - "packages/evaluation/src/evidence.ts already seals attempted cells and honest unrun suffixes."
      facts:
        - "Design: oracle-part-3-v3; 6 repetitions x 3 tasks x 2 arms = 36 sequential cells/18 pairs; three AB and three BA pairs per task with task/order rotation."
        - "Validity: both cells must pass process/transcript/schema/secret/postflight/fairness gates; control Guessless calls=0 and treatment >=1; reported total tokens are recorded, not validity-gated; retain 16 tool-call and 300-second limits."
        - "Stopping: execute all 36 cells once without efficacy early stop, retries, substitution, deletion, or selective omission; require >=5 valid pairs per task and >=16 overall or conclude INCONCLUSIVE."
        - "Analysis: task-stratified paired correctness and efficiency deltas with exact paired/randomization or deterministic exhaustive uncertainty; invalidity reasons explicit; sentinel zeros excluded."
        - "Decision: correctness dominates. Broad adoption requires zero added false-completeness, no task regression, and strong correctness improvement or tied correctness with bounded efficiency gain. Harm or large tied-correctness overhead means do not adopt; intermediate evidence means pilot one sibling; insufficient validity means inconclusive."
        - "Implementation surfaces: evaluation contracts, fixtures, codex, scoring, evidence, CLI, tests, v3 fixture, and generated dist. Evidence adds v3 protocol/commands/scores/benchmarks/decision/summary/manifest and 36 transcript pairs."
      contradictions:
        - "V2 was not a completed paired evaluation; it had zero scored cells and no pair."
        - "Repeated synthetic trials estimate reliability on these fixtures, not universal repository benefit; the defensible decision is scoped to sibling rollout/pilot."
      ambiguity_requiring_judge:
        - "Define ADOPT as sibling integration permission rather than universal causal proof."
        - "Preregister exact small-sample uncertainty and tie handling before live calls."
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Review the Scout proposal and approve the smallest decision-grade v3 protocol and exact non-live Worker package."
    inputs:
      - "T001 receipt"
      - "Current evaluator and immutable evidence"
    constraints:
      - "Read-only; no model/network calls or edits."
      - "Reject underpowered, post-hoc, unfair, token-accounting-invalid, retryable, or overclaiming designs."
    expected_output:
      - "approved or rejected"
      - "Exact preregistered protocol"
      - "Worker allowed_files, verify, and stop_if"
      - "Pre-live audit requirements"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "Approve a new immutable v3 vertical slice: 18 preregistered pairs are the minimum that gives each task three control-first and three Guessless-first repetitions while tolerating one invalid pair per task. V2’s reported-token cap must disappear because Codex reports fixed-context final-turn usage, not marginal task cost. Cell-local failures must be sealed and execution must continue; only authority mutation, secret exposure, or evidence-write failure is run-fatal. Exact paired inference and mechanical adoption thresholds must be implemented and calibrated offline before any live call. The result supports a scoped sibling-repository decision, not a universal performance claim."
      evidence:
        - "Identity is oracle-part-3-v3 with protocol v3, isolated fixture/final/staging paths, and byte-identical v2 inputs, truth, and response schema."
        - "Exact 36-cell order gives each task six pairs, three control-first and three Guessless-first; globally nine pairs start with each arm and task positions are balanced."
        - "All 36 cells run sequentially once without retry, replacement, resume, reordering, efficacy stopping, or selective omission."
        - "Cell validity requires clean spawn/process/transcript/schema/count/tool/secret/postflight/arm compliance. Pair validity requires both cells valid."
        - "Cell-local failures are sealed and execution continues; authority mutation, secret exposure, or durable-evidence failure is run-fatal and classifies INCONCLUSIVE."
        - "reportedTotalTokens is last-turn input plus output usage, finite and recorded only; it never gates validity or represents marginal task cost."
        - "Correctness uses exact planted equality, truth-aligned terminal state, and explicit false-completeness."
        - "Exact paired sign tests use integer binomial arithmetic; ties are reported and excluded from directional n; no asymptotic approximation."
        - "Efficiency is computed only for both-correct valid pairs and reports duration/token ratios and tool-call deltas with task and overall medians."
        - "Exact distribution-free 95% median intervals use deterministic binomial order-statistic bounds with unbounded endpoints when n is insufficient."
        - "INCONCLUSIVE precedes all decisions below 16 valid pairs overall, five per task, after fatal/replay disagreement, or missing metrics."
        - "ADOPT requires no added false-completeness, no task correctness regression, and either significant correctness benefit or tied correctness plus bounded duration efficiency and capped token/tool overhead."
        - "DO_NOT_ADOPT requires added false-completeness, significant correctness harm, or tied correctness with strongly bounded duration/tool overhead; every other valid outcome is PILOT one sibling."
        - "The sealed bundle is exactly 82 files: manifest plus 81 covered members including protocol, commands, scores, benchmarks, decision, replay, summary, runs, calibration, and 72 transcript files."
      missing_evidence:
        - "Offline v3 implementation and calibrated verifier"
        - "Pre-live hash, executable, auth, cost, absence, and command audit"
        - "36-cell sealed live evidence, replayed metrics, adoption decision, and publication"
      required_board_updates:
        - "Activate T003 with the exact approved worker package."
        - "T004 must prove all frozen hashes, v3 parity/order, source/bundled calibration, tests, absence, Codex 0.146.0/auth, projected cost, exact command, and 82-file allowlist."
        - "Post-live audit must prove all 36 attempt slots, validity thresholds, replay equality, decision recomputation, manifest membership, secrets, no retries, and unchanged frozen hashes."
