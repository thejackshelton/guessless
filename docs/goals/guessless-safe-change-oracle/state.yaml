version: 2

goal:
  title: "Guessless prepared-snapshot safe-change oracle"
  slug: guessless-safe-change-oracle
  kind: existing_plan
  tranche: "Validate the source-backed strategy, then implement and verify successive safe vertical slices until the full must-have oracle is proven."
  status: active
  oracle:
    signal: "A preregistered natural-discovery paired evaluation clears the strategy's reliability, selection, correctness, honesty, call-count, and end-to-end efficiency thresholds."
    cadence: "after transport, preparation, semantic-workflow, progressive-output, and final evaluation phase gates"
    final_proof: "Receipt-backed implementation, deterministic tests, full repo verification, immutable evaluation artifacts, and a final Judge audit mapping every quantitative threshold to evidence."
  intake:
    original_request: "$goalbuddy prepare the goal"
    interpreted_outcome: "Implement and prove the JavaScript/TypeScript prepared-snapshot safe-change oracle described in docs/research/guessless-must-have-strategy.md."
    input_shape: existing_plan
    audience: "Guessless maintainers and agent-tool consumers"
    authority: requested
    proof_type: metric
    completion_proof: "All staged gates and the final must-have paired-evaluation gate pass, repository verification is green, and a final Judge records full_outcome_complete true."
    likely_misfire: "Optimize receipt size or add wrappers while calls remain unreliable, or misattribute the cancelled v5 reach treatment result to semantic engine output."
    blind_spots_considered:
      - "Cancellation may originate in the client, host policy, evaluation harness, timeout, transport, or server."
      - "Root ingestion and caches can overclaim coverage or accept stale snapshots."
      - "Role and coordinate projection can convert a correct semantic result into a wrong edit."
      - "Compaction can hide unresolved boundaries or create proof-fetch churn."
      - "Model-backed evaluation requires explicit authority, preregistration, and cost controls."
      - "Synthetic or forced-use benchmarks can overstate discovery and real-workflow value."
    existing_plan_facts:
      - "docs/research/guessless-must-have-strategy.md is the approved source-backed plan."
      - "Priority order: reliability; one-call preparation; task-shaped safe-change impact; reusable snapshots; stable identity/progressive proof; discovery and scope."
      - "Final gates include >=99% completion, >=80% unforced selection, <=2 cold/<=1 warm calls, zero added false completeness, no regression, >=4 net wins with one-sided p<=0.10, and >=20% time or >=25% tool-call reduction."
      - "All 68 v5 Guessless calls were cancelled and delivered no semantic output; v5 cannot prove engine benefit."
      - "Sealed v3-v5 evidence must remain immutable."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

