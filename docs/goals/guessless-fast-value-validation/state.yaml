tasks:
  - id: T001
    type: pm
    assignee: PM
    status: done
    reasoning_hint: medium
    objective: "Within one five-minute preflight, select a valid authentic task and immediately run the first control/treatment real-agent pair."
    inputs:
      - "T009 receipt from docs/goals/guessless-real-agent-benchmark/state.yaml"
      - "/Users/jacksm5pro/dev/open-source/markless"
      - "/Users/jacksm5pro/dev/open-source/frameless"
      - "/Users/jacksm5pro/dev/open-source/versionless"
      - "Current Guessless MCP as-is"
    allowed_files:
      - "docs/evidence/guessless-fast-value-validation/"
      - "/private/tmp/guessless-fast-value-validation/"
    constraints:
      - "Spend at most five minutes before launch proving solution/history absence, no absolute source-repository dependency link, exact focused-test pass, and a task-relevant pre-edit structural question."
      - "If the candidate fails any preflight gate, discard it before launch; do not repair dependencies, install, create a runner, or weaken the test."
      - "Launch fresh gpt-5.6-sol control/treatment cells immediately after the preflight passes."
      - "Treatment must receive the frozen explicit Guessless context and must complete snapshot preparation plus one narrower task-relevant query before its first edit."
      - "Control/treatment otherwise use identical product tree, base prompt, model, environment, sandbox, focused test, and no timeout."
      - "Capture only raw JSONL, final response, complete staged binary patch, focused-test output, wall time, counted tools, and treatment result-use trace."
      - "No harness, setup, evaluator, fixture, install, package, lockfile, product, prior-evidence, dashboard, or elaborate seal work."
      - "No retry or repair after launch."
    verify:
      - "One valid authentic pair completed with both cells model-backed and exact focused tests attempted."
      - "The treatment transcript proves a concrete pre-edit structural result and whether it materially informed work."
      - "The compact pair evidence is sufficient for a five-minute Judge audit."
    stop_if:
      - "No candidate passes all four preflight gates inside five minutes."
      - "A solution, original Git history, another arm, or absolute source-repository link is exposed."
    receipt:
      result: done
      changed_files:
        - "docs/evidence/guessless-fast-value-validation/pair-01/"
      commands:
        - cmd: "four-gate candidate preflight"
          status: pass
        - cmd: "parallel gpt-5.6-sol control/treatment launch"
          status: pass
        - cmd: "pnpm exec vitest run --configLoader runner packages/compiler/test/compile-module.test.ts packages/compiler/test/semantic-diagnostics.test.ts"
          status: pass
        - cmd: "jq/hash/tree-parity compact-evidence verification"
          status: pass
      summary: "Completed one authentic Markless control/treatment pair from identical parent-only trees. Both gpt-5.6-sol cells produced patches and passed the exact focused tests; treatment completed a Guessless snapshot and narrower impact query before its first edit and stated how the partial result constrained implementation and tests. Compact raw, patch, test, timing, tool, token, and use-trace evidence is ready for the five-minute Judge audit."
      deviations:
        - "Three candidates were discarded without repair inside the four-minute-three-second preflight before the final candidate passed all gates."
        - "The first model process started two minutes sixteen seconds after the passing preflight while the two fresh parity roots and frozen prompt files were created; this was pair launch preparation, not additional candidate validation."
        - "Treatment needed two failing focused-test iterations before its final two successful runs; control's two focused-test runs both passed. No cell was retried or resumed."
      remaining_blockers: []
      verification_attempts: 1
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit pair one in at most five minutes and apply the locked pair-win and continuation rules."
    inputs:
      - "T001 receipt and compact pair evidence"
      - "Historical solution behavior"
      - "Locked decision policy in goal.md"
    constraints:
      - "Read-only; do not rerun agents, edit evidence, or run broad suites."
      - "Cap audit time at five minutes."
      - "Score semantic correctness, focused-test completion, false completeness, pre-edit material use, wall time, and counted tools."
    expected_output:
      - "treatment_win | control_win | tie | invalid"
      - "Material-use verdict"
      - "Exact pair-two task constraints or binary stop if the locked rule already permits it"
    receipt:
      result: done
      decision: control_win
      full_outcome_complete: false
      rationale: "Both arms passed the exact focused command but are semantically incomplete versus historical solution 931f054: each rejects a same-file const string used as a computed key despite claiming task completion. Thus both false-completed; the locked rule makes treatment false completion a control win. Treatment was also slower (390s versus 350s) and used more counted tools (25 versus 24), so it had no efficiency win."
      material_use:
        verdict: material
        before_first_edit: true
        result: "Resolved one diagnostic declaration and one live import/call; used to select the initial compiler target and focused-test coverage."
      arms:
        control:
          semantic_correct: false
          tested_complete: true
          false_complete: true
          wall_seconds: 350
          counted_tools: 24
        treatment:
          semantic_correct: false
          tested_complete: true
          false_complete: true
          wall_seconds: 390
          counted_tools: 25
      evidence:
        - "Both focused-test records pass; control has 156 tests and treatment 155."
        - "Both patches omit compile-time resolution of computed identifiers such as const KEY = 'letterSpacing'; style={{ [KEY]: 2 }}."
        - "Historical solution 931f054 resolves same-binding const strings and tests that case."
        - "Treatment snapshot and impact query precede item_14, the first file change; item_5 records the concrete scope/test decision."
      pair_two_constraint: "Use a repository other than Markless under the unchanged five-minute four-gate preflight, model, prompts, Guessless context, parity rules, focused-test requirement, compact evidence shape, no-timeout, and no-retry protocol."
      remaining_blockers: []
  - id: T003
    type: pm
    assignee: PM
    status: blocked
    reasoning_hint: medium
    objective: "Run pair two on an authentic task from a different repository under the unchanged time-boxed protocol."
    inputs:
