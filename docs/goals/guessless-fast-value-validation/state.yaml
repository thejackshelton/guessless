version: 2

goal:
  title: "Guessless fast, high-value validation"
  slug: guessless-fast-value-validation
  kind: specific
  tranche: "Run the smallest sequential real-agent benchmark that can support a binary adoption decision, with 20 minutes of validation overhead for two pairs and 30 minutes maximum with the tie-breaker."
  status: done
  terminal_decision: DO_NOT_SHIP_FOR_NOW
  oracle:
    signal: "Authentic paired real-agent patches and focused tests show whether mandatory pre-edit Guessless use changes correctness or efficiency."
    cadence: "after each pair and at final audit"
    final_proof: "A Judge-verified binary adoption decision grounded in valid paired patches, focused tests, material-use traces, time, and tool counts."
  intake:
    original_request: "Make a new goal where the time spent validating is as short as possible and full of value."
    interpreted_outcome: "Replace the failed broad study with a minimal sequential real-agent experiment in which every validation step either prevents invalid evidence or directly informs the adoption decision."
    input_shape: recovery
    audience: "Guessless maintainer deciding whether to pilot the tool with coding agents"
    authority: approved
    proof_type: decision
    completion_proof: "A final independent Judge issues SHIP_PILOT or DO_NOT_SHIP_FOR_NOW from valid tested pairs under the locked sequential policy."
    likely_misfire: "Spending time on harnesses, seals, setup, broad suites, optional-tool adoption, or artifact polish instead of obtaining causal real-agent evidence."
    blind_spots_considered:
      - "A runnable focused test must be proven before spending agent cells."
      - "Original repository history or dependency symlinks can leak the hidden solution."
      - "Availability or snapshot invocation alone does not measure Guessless value."
      - "A binary adoption policy must be locked before results exist."
    existing_plan_facts:
      - "The prior v4 study is sealed but decision-inadequate and must not be extended or edited."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/guessless-fast-value-validation/"
    command: "node /Users/jacksm5pro/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/guessless-fast-value-validation"

