        - "Three Versionless candidates were discarded for failed creation, task-bearing parent content plus an unresolved virtual store, or a missing package-local Vitest config."
      remaining_blockers:
        - "No valid pair-two candidate passed the exact focused test inside the five-minute preflight."
      verification_attempts: 1
      stopped_because: "T003 stop_if fired: no candidate passed all four gates inside five minutes."
  - id: T004
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit pair two in at most five minutes and either apply the locked early binary decision or require pair three."
    inputs:
      - "T001-T003 receipts"
      - "Locked decision policy"
    constraints:
      - "Read-only and five-minute maximum."
      - "Do not move thresholds after observing results."
      - "If the two-pair early-stop rule fires, direct PM to T999; otherwise specify only the repository/task constraints for the single tie-breaker."
    expected_output:
      - "Pair-two score"
      - "SHIP_PILOT | DO_NOT_SHIP_FOR_NOW | run_pair_three"
      - "Reason tied directly to locked thresholds"
    receipt:
      result: done
      decision: DO_NOT_SHIP_FOR_NOW
      full_outcome_complete: false
      rationale: "Pair one is a locked control win because treatment false-completed despite material pre-edit use. Pair two was refused before launch. SHIP_PILOT is mathematically impossible because the final bar requires at least two treatment wins, no control win, and no treatment false completion, while pair one already contains both disqualifiers. Pair three cannot change the binary outcome; proceed directly to T999."
      evidence:
